name: update recipes

on:
  schedule:
    - cron: '10 21 * * 1'
  workflow_dispatch:

jobs:
  update:
    name: update recipes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: ${{ vars.SCHEDULED_AUTO_UPDATE || github.event_name == 'workflow_dispatch' || github.repository == 'labgrid-project/meta-labgrid' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Configure git
        run: |
          git config user.email "info@pengutronix.de"
          git config user.name "Recipe Updater Bot"

      - name: Create a new branch
        run: |
          git remote add upstream "${{ github.server_url }}/labgrid-project/meta-labgrid.git"
          git fetch upstream
          git checkout -b "update/recipes-$(date +%Y%m%d)" upstream/master

      - name: Run update script
        run: |
          git checkout "${{ github.sha }}" -- tools/update/
          python3 -u tools/update/update.py tools/update/recipes.yaml

      - name: Commit changes to recipes
        id: recipe-commit
        run: |
          git add .
          git reset tools/update/
          git commit --signoff --message="Recipe updates for $(date +%Y-%m-%d)"
        continue-on-error: true

      - name: Push changes upstream
        if: ${{ steps.recipe-commit.outcome == 'success' }}
        run: git push --set-upstream origin "$(git branch --show-current)"

      - name: Create pull request
        if: ${{ steps.recipe-commit.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base "master" \
            --body "I hope you'll like it." \
            --title "Recipe updates for $(date +%Y-%m-%d)"
